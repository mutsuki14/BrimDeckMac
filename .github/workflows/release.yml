name: Publish macOS release
# v1.2.1 publishes from a commit on main. v1.2.1-alpha.1 and v1.2.1-beta.1 publish a prerelease from dev.
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Check tag name and branch
        id: tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta)\.[0-9]+)?)$ ]]; then
            echo "Use v1.2.1 for a release, or v1.2.1-alpha.1 or v1.2.1-beta.1 for a prerelease." >&2
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          prerelease=false
          [[ "$version" == *-* ]] && prerelease=true
          branch=main
          [[ "$prerelease" == true ]] && branch=dev
          git fetch origin "$branch"
          git merge-base --is-ancestor HEAD "origin/$branch"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
  release:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      RELEASE_VERSION: ${{ needs.check.outputs.version }}
      RELEASE_PRERELEASE: ${{ needs.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Mac tests
        run: dotnet run --project tests/BrimDeck.MacTests -c Release
      - name: Package Apple silicon and Intel apps
        run: |
          scripts/publish-mac.sh osx-arm64
          scripts/publish-mac.sh osx-x64
          cd artifacts/releases
          sha256sum BrimDeck-*.zip | tee SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          notes="releases/${RELEASE_VERSION}-macos.md"
          if [ ! -f "$notes" ]; then notes="releases/${RELEASE_VERSION}.md"; fi
          files=(artifacts/releases/*)
          draft_args=(release create "$RELEASE_TAG" "${files[@]}" --target "$RELEASE_COMMIT" --title "BrimDeck ${RELEASE_VERSION}" --notes-file "$notes" --draft)
          if [ "$RELEASE_PRERELEASE" = "true" ]; then draft_args+=(--prerelease); fi
          gh "${draft_args[@]}"
          if [ "$RELEASE_PRERELEASE" = "true" ]; then
            gh release edit "$RELEASE_TAG" --draft=false
          else
            gh release edit "$RELEASE_TAG" --draft=false --latest
          fi
